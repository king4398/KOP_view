<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SCHISM MapLibre Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
html, body, #map { width:100%; height:100%; margin:0; padding:0; overflow:hidden; }
#map { background:#111; }
#particle-canvas { position:absolute; left:0; top:0; pointer-events:none; z-index:20; }
.title-box {
    position: fixed;
    left: 58px;
    top: 10px;
    bottom: auto;
    z-index: 50000;
    background: rgba(255,255,255,0.95);
    padding: 8px 12px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    font-family: Arial, sans-serif;
    font-weight: bold;
}
.legend-box { position:fixed; right:14px; bottom:86px; z-index:50000; background:rgba(255,255,255,0.95); padding:10px 12px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.35); font-family:Arial,sans-serif; min-width:230px; }
.control-box { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:60000; background:rgba(255,255,255,0.96); padding:10px 14px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.35); font-family:Arial,sans-serif; min-width:720px; }
.side-panel { position:fixed; right:14px; top:72px; z-index:55000; width:270px; padding:12px 14px; border-radius:12px; background:rgba(15,18,24,0.84); color:white; font-family:Arial,sans-serif; font-size:13px; box-shadow:0 4px 18px rgba(0,0,0,0.38); }
.side-panel-title { font-weight:bold; font-size:15px; margin-bottom:9px; }
.side-panel label { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0; }
.side-panel select { width:135px; max-width:135px; padding:4px 6px; }
.side-panel input[type="checkbox"] { transform:scale(1.12); }
.status-line { font-size:11px; opacity:0.80; margin-top:8px; line-height:1.35; }
button, select, input { font-family:Arial,sans-serif; }

.basemap-radio-box {
    position: fixed;
    right: 14px;
    top: 10px;
    z-index: 70000;
    background: rgba(255,255,255,0.96);
    color: #222;
    padding: 7px 10px;
    border-radius: 4px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.35);
    font-family: Arial, sans-serif;
    font-size: 14px;
    line-height: 1.45;
}

.basemap-radio-box label {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    cursor: pointer;
}

.basemap-radio-box input {
    margin: 0;
}

  /* ===== UST21 logo overlay ===== */
  #ust21-logo-overlay {
    position: fixed;
    left: 16px;
    bottom: 18px;
    z-index: 5000;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    pointer-events: auto;
    max-width: 150px !important;
}

  #ust21-logo-title {
    margin: 0 0 8px 2px;
    padding: 4px 10px;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
    color: #ffffff;
    background: rgba(0,0,0,0.55);
    border-radius: 8px;
    letter-spacing: -0.2px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    white-space: nowrap;
  }

  J0px;
    height: auto;
    display: block;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
  }


  #viewer-badge, .viewer-badge, #schism-viewer-badge {
    display: none !important;
  }

#ust21-logo-img {
    width: 120px !important;
    max-width: 120px !important;
    height: auto !important;
    display: block;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.35));
}

/* ===== Mobile layout ===== */
@media (max-width: 768px) {
  .title-box {
    left: 8px !important;
    top: 8px !important;
    padding: 5px 8px !important;
    font-size: 12px !important;
    max-width: calc(100vw - 150px) !important;
    white-space: nowrap !important;
  }

  .basemap-radio-box {
    right: 8px !important;
    top: 8px !important;
    padding: 5px 7px !important;
    font-size: 12px !important;
  }

  .side-panel {
    left: 8px !important;
    right: auto !important;
    top: 48px !important;
    width: calc(100vw - 16px) !important;
    box-sizing: border-box !important;
    padding: 7px 9px !important;
    border-radius: 8px !important;
    font-size: 12px !important;
    background: rgba(15,18,24,0.78) !important;
  }

  .side-panel-title {
    font-size: 13px !important;
    margin-bottom: 4px !important;
  }

  .side-panel label {
    margin: 4px 0 !important;
  }

  .side-panel select {
    width: 120px !important;
    max-width: 120px !important;
    padding: 3px 5px !important;
    font-size: 12px !important;
  }

  .status-line {
    display: none !important;
  }

  .legend-box {
    right: 8px !important;
    bottom: 118px !important;
    min-width: 150px !important;
    width: 150px !important;
    padding: 7px 8px !important;
    font-size: 11px !important;
  }

  .legend-title {
    font-size: 11px !important;
  }

  .control-box {
    left: 8px !important;
    right: 8px !important;
    bottom: 8px !important;
    transform: none !important;
    min-width: 0 !important;
    width: calc(100vw - 16px) !important;
    box-sizing: border-box !important;
    padding: 7px 8px !important;
    border-radius: 8px !important;
  }

  .control-box > div {
    gap: 6px !important;
    flex-wrap: wrap !important;
  }

  #play-btn {
    padding: 4px 8px !important;
    font-size: 12px !important;
  }

  #frame-slider {
    width: calc(100vw - 150px) !important;
    min-width: 150px !important;
    flex: 1 1 auto !important;
  }

  #speed-select {
    padding: 4px 5px !important;
    font-size: 12px !important;
  }

  #opacity-slider {
    width: 80px !important;
  }

  #time-label {
    min-width: 0 !important;
    width: 100% !important;
    font-size: 12px !important;
  }

  #ust21-logo-overlay {
    left: 8px !important;
    bottom: 92px !important;
    max-width: 90px !important;
  }

  #ust21-logo-title {
    font-size: 11px !important;
    padding: 3px 6px !important;
    margin-bottom: 4px !important;
  }

  #ust21-logo-img {
    width: 78px !important;
    max-width: 78px !important;
  }
}

@media (max-width: 480px) {
  .side-panel {
    top: 44px !important;
  }

  .legend-box {
    bottom: 126px !important;
    width: 135px !important;
    min-width: 135px !important;
  }

  #frame-slider {
    width: calc(100vw - 135px) !important;
  }

  .control-box label {
    font-size: 11px !important;
  }

  #opacity-slider {
    width: 65px !important;
  }
}


/* ===== Mobile playbar compact patch ===== */
@media (max-width: 768px) {
  #frame-slider {
    width: 45vw !important;
    min-width: 120px !important;
    max-width: 220px !important;
    flex: 0 0 45vw !important;
  }

  .legend-box {
    bottom: 142px !important;
  }
}

@media (max-width: 480px) {
  #frame-slider {
    width: 42vw !important;
    min-width: 105px !important;
    max-width: 180px !important;
    flex: 0 0 42vw !important;
  }

  .legend-box {
    bottom: 152px !important;
  }
}

</style>
</head>
<body>
<div id="map"></div>

<div id="basemap-radio-box" class="basemap-radio-box">
  <label>
    <input type="radio" name="basemap-radio" value="carto">
    <span>일반지도</span>
  </label>
  <label>
    <input type="radio" name="basemap-radio" value="esri" checked>
    <span>위성지도</span>
  </label>
</div>
<div class="title-box">SCHISM MapLibre Viewer</div>
<div class="legend-box" id="legend-box"></div>
<div class="side-panel">
  <div class="side-panel-title">Layer Options</div>

<label><span><b>Variable</b></span><select id="var-select"><option value="temperature">Temperature</option>
            <option value="salinity">Salinity</option><option value="ssh">Elevation</option><option value="current">Current</option></select></label>
  <label><span><b>Current overlay</b></span><input id="current-overlay-check" type="checkbox" checked></label>
  <label><span><b>Mesh overlay</b></span><input id="mesh-overlay-check" type="checkbox"></label>
  <label><span><b>Particles</b></span><select id="particle-density-select"><option value="800">Low</option><option value="1600">Mid</option><option value="2800" selected>High</option></select></label>
  <div class="status-line" id="status-line">Loading...</div>
</div>
<div class="control-box"><div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
  <button id="play-btn" style="padding:5px 12px; cursor:pointer;">Play</button>
  <input id="frame-slider" type="range" min="0" max="0" value="0" step="1" style="width:330px;">
  <select id="speed-select" style="padding:5px 8px;">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="2">2x</option>
    </select>
  <label><b>Opacity</b></label><input id="opacity-slider" type="range" min="0.1" max="1.0" value="0.82" step="0.05" style="width:110px;">
  <span id="time-label" style="font-size:13px; min-width:180px; display:inline-block;"></span>
</div></div>
<script src="maplibre_schism.js?v=mobile_playbar_legend01"></script>

  <div id="ust21-logo-overlay">
    <div id="ust21-logo-title">UST21 수치예보팀</div>
    <div id="made-by-nyj" style="display:none; margin:0 0 8px 2px; padding:4px 10px; font-size:13px; font-weight:700; color:#ffffff; background:rgba(0,0,0,0.55); border-radius:8px; text-shadow:0 1px 2px rgba(0,0,0,0.35);">made by nyj</div>
    <img id="ust21-logo-img" src="assets/ust21.png" alt="UST21 logo" width="120">
  </div>


<script>
(function(){
  function setupUst21Click(){
    const title = document.getElementById("ust21-logo-title");
    const made = document.getElementById("made-by-nyj");
    if(!title || !made || title.dataset.clickReady === "1") return;
    title.dataset.clickReady = "1";
    title.addEventListener("click", function(ev){
      ev.preventDefault();
      ev.stopPropagation();
      made.style.display = (made.style.display === "none" || made.style.display === "") ? "block" : "none";
    });
  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", setupUst21Click);
  } else {
    setupUst21Click();
  }
})();
</script>

</body>
</html>
