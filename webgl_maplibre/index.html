<script>
(function(){
  function detectDeviceLayout(){
    const ua = navigator.userAgent || "";
    const isMobileUA = /Android|iPhone|iPad|iPod|Mobile|BlackBerry|IEMobile|Opera Mini/i.test(ua);
    const isSmallScreen = window.innerWidth <= 768;
    const isTouch = navigator.maxTouchPoints && navigator.maxTouchPoints > 0;

    const isMobile = isMobileUA || (isSmallScreen && isTouch);

    document.documentElement.classList.remove("device-mobile", "device-pc");
    document.body.classList.remove("device-mobile", "device-pc");

    if(isMobile){
      document.documentElement.classList.add("device-mobile");
      document.body.classList.add("device-mobile");
    } else {
      document.documentElement.classList.add("device-pc");
      document.body.classList.add("device-pc");
    }
  }

  window.KOP_detectDeviceLayout = detectDeviceLayout;

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", detectDeviceLayout);
  } else {
    detectDeviceLayout();
  }

  window.addEventListener("resize", function(){
    clearTimeout(window.KOP_deviceResizeTimer);
    window.KOP_deviceResizeTimer = setTimeout(detectDeviceLayout, 150);
  });
})();
</script>

<script>
(function(){
  function setupLayerPanelToggleWindy(){
    const panel = document.querySelector(".side-panel");
    const title = document.querySelector(".side-panel-title");
    if(!panel || !title) return;

    title.onclick = function(ev){
      if(!document.body.classList.contains("device-mobile")) return;
      ev.preventDefault();
      ev.stopPropagation();
      panel.classList.toggle("collapsed");
    };
  }

  function syncOpacitySliders(){
    const main = document.getElementById("opacity-slider");
    const panel = document.getElementById("opacity-slider-panel");
    if(!main || !panel || panel.dataset.opacitySyncReady === "1") return;

    panel.dataset.opacitySyncReady = "1";
    panel.value = main.value;

    panel.addEventListener("input", function(){
      main.value = panel.value;
      main.dispatchEvent(new Event("input", {bubbles:true}));
    });

    main.addEventListener("input", function(){
      panel.value = main.value;
    });
  }

  function setup(){
    setupLayerPanelToggleWindy();
    syncOpacitySliders();
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", setup);
  } else {
    setup();
  }

  window.addEventListener("resize", function(){
    setTimeout(setup, 100);
  });
})();
</script>
